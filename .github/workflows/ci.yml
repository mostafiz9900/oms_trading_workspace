# Checks for every branch and pull request: analyze, tests, debug builds.
# The prod branch runs these same checks from release.yml before releasing.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [prod]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  analyze:
    name: analyze ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every package is analyzed strictly: any error, warning or info fails.
        package:
          - packages/core/trading_core
          - packages/core/trading_ui
          - packages/core/broker_config
          - packages/shared/localization
          - packages/shared/oms_shared
          - apps/benemoy
    steps:
      - uses: actions/checkout@v4
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - run: flutter pub get
      - run: dart analyze --fatal-infos .
        working-directory: ${{ matrix.package }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - run: flutter pub get
      - run: dart test
        working-directory: packages/core/broker_config
      - run: flutter test
        working-directory: packages/shared/oms_shared
      - run: dart run tool/validate_apps.dart

  build:
    name: build ${{ matrix.platform }} (benemoy uat)
    needs: [analyze, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            command: flutter build apk --debug
          - platform: ios
            os: macos-latest
            command: flutter build ios --debug --no-codesign
    steps:
      - uses: actions/checkout@v4
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Write UAT env
        working-directory: apps/benemoy
        env:
          PROFILE: ${{ secrets.BENEMOY_UAT_PROFILE_JSON }}
        run: |
          # Pull requests from forks get no secrets: build with placeholders,
          # which still proves that everything compiles.
          if [ -n "$PROFILE" ]; then
            printf '%s' "$PROFILE" > env/uat.json
          else
            echo "::warning::BENEMOY_UAT_PROFILE_JSON not set; building with env/example.json"
            cp env/example.json env/uat.json
          fi
      - run: flutter pub get
      - run: >-
          ${{ matrix.command }} -t lib/main_uat.dart
          --dart-define-from-file=env/uat.json
        working-directory: apps/benemoy
