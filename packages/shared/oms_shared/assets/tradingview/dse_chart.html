<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DSE TradingView Chart</title>
</head>
<body style="margin:0">
<div class="tradingview-widget-container">
    <div id="tradingview_container"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        function createChart(symbol) {
          new TradingView.widget({
            "width": "100%",
            "height": "100%",
            "symbol": symbol,
            "interval": "D",
            "timezone": "Asia/Dhaka",
            "theme": "light",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_container",
            "hide_side_toolbar": true,      // hide left toolbar
            "hide_top_toolbar": false,
            "hide_legend": true,
            "hideideas": true,               // hide community ideas
            "studies_overrides": {},
            "save_image": false               // disable download alert
          });
        }
        // Default chart
        createChart("DSEBD-DSEX");
    </script>
</div>
</body>
</html>
