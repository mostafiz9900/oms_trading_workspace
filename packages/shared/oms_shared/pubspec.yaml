name: oms_shared
description: Shared OMS trading application (screens, state, services) used by every broker-house app.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  trading_core:
    path: ../../core/trading_core
  trading_ui:
    path: ../../core/trading_ui
  broker_config:
    path: ../../core/broker_config
  auth:
    path: ../../features/auth
  market:
    path: ../../features/market
  orders:
    path: ../../features/orders
  withdrawals:
    path: ../../features/withdrawals
  portfolio:
    path: ../../features/portfolio
  notifications:
    path: ../../features/notifications
  research:
    path: ../../features/research
  limits:
    path: ../../features/limits
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  hooks_riverpod: ^3.0.3
  flutter_riverpod: ^3.4.3
  signals_flutter: ^7.1.0
  flutter_hooks: ^0.21.3+1
  dio: ^5.9.0
  crypto: ^3.0.7
  path_provider: ^2.1.6
  internet_connection_checker_plus: ^3.0.0
  flutter_easyloading: ^3.0.5
  fluttertoast: ^9.0.0
  get_storage: ^2.1.1
  google_fonts: ^8.1.0
  connectivity_plus: ^7.1.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  loader_overlay: ^5.0.0
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.3
  socket_io_client: ^3.1.3
  image_picker: ^1.2.1
  image: ^4.5.4
  interactive_chart: ^0.3.6
  dropdown_button2: ^3.1.0
  intl: ^0.20.2
  fl_chart: ^1.1.1
  pie_chart: ^5.4.0
  syncfusion_flutter_charts: ^34.2.6
  syncfusion_flutter_datepicker: ^34.2.6
  syncfusion_flutter_core: ^34.2.6
  syncfusion_flutter_treemap: ^34.2.6
  flutter_staggered_grid_view: ^0.7.0
  web_socket_channel: ^3.0.3
  email_validator: ^3.0.0
  flutter_typeahead: ^6.0.0
  flutter_speed_dial: ^7.0.0
  local_auth: ^3.0.2
  uuid: ^4.5.2
  candlesticks: ^3.0.0
  flutter_in_store_app_version_checker: ^3.0.1
  new_version_plus: ^1.0.1
  highcharts_flutter: ^1.2.0
  syncfusion_flutter_sliders: ^34.2.6
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  popover: ^0.4.0
  horizontal_data_table: ^4.3.4
  url_launcher: ^6.3.2
  share_plus: ^12.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg_image/
    - assets/json/
    - assets/tradingview/dse_chart.html
