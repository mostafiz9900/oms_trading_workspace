name: house_profile
description: Create a local broker-house build profile, branding manifest, and Android flavor metadata.
version: 1.0.0
environment:
  mason: ^0.1.3
vars:
  house_id:
    type: string
    description: Lowercase house slug, such as north_broker
    prompt: Broker-house ID?
  display_name:
    type: string
    description: App name shown to users
    prompt: Broker-house display name?
  android_application_id:
    type: string
    description: Unique Android application ID
    prompt: Android application ID?
  ios_bundle_id:
    type: string
    description: Unique iOS bundle ID
    prompt: iOS bundle ID?
  environment:
    type: enum
    description: Target server environment
    values:
      - uat
      - prod
    default: uat
    prompt: Which environment profile should be scaffolded?
