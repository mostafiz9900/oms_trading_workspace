name: oms_trading_workspace

packages:
  - "apps/*"
  - "packages/core/*"
  - "packages/features/*"

command:
  bootstrap:
    usePubspecOverrides: true

  scripts:
    analyze:
      exec: fvm flutter analyze
      description: Run analyzer in all packages.
    build:runner:
      exec: fvm flutter pub run build_runner build --delete-conflicting-outputs
      description: Run build_runner in all packages to generate code.