name: oms_trading_workspace
publish_to: none

environment:
  sdk: ^3.13.5

workspace:
  - apps/*
  - packages/*/*

dev_dependencies:
  melos: ^8.9.0

melos:
  command:
    version:
      # `melos version` bumps changed packages from conventional commits and
      # writes per-package and workspace CHANGELOG.md files.
      workspaceChangelog: true

  scripts:
    analyze:
      exec:
        command: fvm dart analyze --fatal-infos .
        concurrency: 4
        failFast: true
      description: Analyze every package strictly (warnings and infos fail).
    test:
      exec:
        command: fvm flutter test
        concurrency: 1
        failFast: true
      description: Run each package's Flutter tests.
    validate:
      run: fvm dart run tool/validate_apps.dart
      description: Check env files, brand assets and app ids of every app.
